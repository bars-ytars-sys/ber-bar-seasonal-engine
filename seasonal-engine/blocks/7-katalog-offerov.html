<style>

<script>
(function () {
  'use strict';
  var BB = window.BB || {};
  if (!BB.num) { console.warn('BB: не подключены блоки 1–3 в HEAD'); return; }

  /* Человеческие названия фильтров. Ключ = то, что пишется в "tags". */
  var TAGS = {
    dvoim:     'Для двоих',
    semya:     'С детьми',
    kompaniey: 'Компанией',
    budni:     'Будни',
    banya:     'С баней и чаном',
    spa:       'SPA',
    sertifikat:'Сертификаты',
    korporativ:'Корпоративам'
  };
  var BADGES = { hot: 'горит', new: 'новинка', last: 'последние даты' };

  var root = document.getElementById('bb-offers-root');
  var grid = document.getElementById('bb-offers-grid');
  var box  = document.getElementById('bb-offers-filters');
  var empty= document.getElementById('bb-offers-empty');
  var raw  = document.getElementById('bb-offers');
  if (!root || !raw) return;

  /* --- Прощающий разбор: убираем // комментарии и лишние запятые ---------- */
  function parse(text) {
    var clean = text
      .replace(/^\s*\/\/.*$/gm, '')
      .replace(/,(\s*[\]}])/g, '$1');
    return JSON.parse(clean);
  }

  var offers = [], parseError = null;
  try { offers = parse(raw.textContent); }
  catch (e) { parseError = e.message; offers = []; }

  /* --- Проверка данных. Ошибки видны на /special?debug=offers ------------- */
  var problems = [];
  if (parseError) problems.push('Список не читается: ' + parseError + '. Чаще всего — лишняя или пропущенная запятая.');

  offers.forEach(function (o, i) {
    var w = 'Оффер #' + (i + 1) + ' (' + (o.id || 'без id') + '): ';
    if (!o.id)    problems.push(w + 'нет "id"');
    if (!o.title) problems.push(w + 'нет "title"');
    if (!o.price) problems.push(w + 'НЕТ ЦЕНЫ. Оффер без цены не работает — поставьте хотя бы "от"');
    if (!o.sale || !o.sale.to) problems.push(w + 'нет срока действия sale.to — оффер не сможет исчезнуть сам');
    if (!o.book || (!o.book.from && !o.more)) problems.push(w + 'нет ни book.from, ни more — кнопке некуда вести');
    if (o.sale && o.sale.to && BB.num(o.sale.to) === null) problems.push(w + 'sale.to должен быть в формате ГГГГ-ММ-ДД');
    (o.tags || []).forEach(function (t) { if (!TAGS[t]) problems.push(w + 'неизвестный фильтр "' + t + '"'); });
  });

  if (BB.param('debug') === 'offers') {
    var d = document.createElement('div');
    d.className = 'bb-debug';
    d.innerHTML = '<b>Проверка каталога офферов</b><br>Всего: ' + offers.length + '<br>' +
      (problems.length ? problems.map(function (p) { return '• ' + p; }).join('<br>') : 'Ошибок нет.');
    root.insertBefore(d, root.firstChild);
  } else if (problems.length) {
    console.warn('BB офферы: ' + problems.length + ' замечаний. Откройте ' + location.pathname + '?debug=offers');
  }

  /* --- Отбор живых офферов ------------------------------------------------ */
  var today = BB.today || BB.todayNum();
  var live = offers.filter(function (o) {
    if (!o.sale) return true;
    if (o.sale.from && today < BB.num(o.sale.from)) return false;
    if (o.sale.to   && today > BB.num(o.sale.to))   return false;
    return true;
  });

  /* «Горит» и то, что кончается раньше, — выше */
  var order = { hot: 0, last: 1, new: 2 };
  live.sort(function (a, b) {
    var oa = order[a.badge] === undefined ? 3 : order[a.badge];
    var ob = order[b.badge] === undefined ? 3 : order[b.badge];
    if (oa !== ob) return oa - ob;
    return (BB.num(a.sale && a.sale.to) || 99999999) - (BB.num(b.sale && b.sale.to) || 99999999);
  });

  /* --- Вспомогательное ---------------------------------------------------- */
  function money(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽'; }
  function ruDate(s) {
    var M = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? (+m[3]) + ' ' + M[+m[2] - 1] : s;
  }
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined) n.textContent = txt;
    return n;
  }

  /* --- Карточка ----------------------------------------------------------- */
  function card(o) {
    var c = el('article', 'bb-card');
    c.setAttribute('data-tags', (o.tags || []).join(' '));

    var head = el('div', 'bb-card__head');
    if (o.badge && BADGES[o.badge]) head.appendChild(el('span', 'bb-card__badge bb-card__badge--' + o.badge, BADGES[o.badge]));
    head.appendChild(el('h3', 'bb-card__title', o.title));
    if (o.lead) head.appendChild(el('p', 'bb-card__lead', o.lead));
    c.appendChild(head);

    if (o.price) {
      var p = el('div', 'bb-card__price');
      p.appendChild(el('b', '', 'от ' + money(o.price)));
      if (o.oldPrice) p.appendChild(el('s', '', money(o.oldPrice)));
      c.appendChild(p);
      if (o.priceNote) c.appendChild(el('div', 'bb-card__pricenote', o.priceNote));
    }

    var body = el('div', 'bb-card__body');
    if ((o.includes || []).length) {
      var ul = el('ul', 'bb-card__list');
      o.includes.forEach(function (t) { ul.appendChild(el('li', '', t)); });
      body.appendChild(ul);
    }
    if ((o.excludes || []).length) {
      var ul2 = el('ul', 'bb-card__list bb-card__list--no');
      o.excludes.forEach(function (t) { ul2.appendChild(el('li', '', t)); });
      body.appendChild(ul2);
    }

    var meta = el('div', 'bb-card__meta');
    if (o.stay && o.stay.from) {
      var d1 = el('div');
      d1.innerHTML = 'Даты заезда: <b>' + ruDate(o.stay.from) + ' — ' + ruDate(o.stay.to) + '</b>';
      meta.appendChild(d1);
    }
    if (o.sale && o.sale.to) {
      var d2 = el('div');
      d2.innerHTML = 'Действует до <b>' + ruDate(o.sale.to) + '</b> включительно';
      meta.appendChild(d2);
    }
    if (o.rules) meta.appendChild(el('div', '', o.rules));
    body.appendChild(meta);
    c.appendChild(body);

    /* Таймер — только настоящий, от даты окончания. Не перезапускается. */
    if (o.sale && o.sale.to) {
      var timer = el('div', 'bb-card__timer');
      timer.setAttribute('data-until', o.sale.to);
      c.appendChild(timer);
    }

    if (o.promo) {
      var wrap = el('div', 'bb-card__promo');
      var btn = el('button', 'bb-promo');
      btn.type = 'button';
      btn.innerHTML = '<span>' + o.promo + '</span><small>нажмите, чтобы скопировать</small>';
      btn.addEventListener('click', function () {
        var done = function () {
          btn.classList.add('is-copied');
          btn.querySelector('small').textContent = 'скопировано';
          BB.goal && BB.goal('promo_copy', { offer: o.id, promo: o.promo });
        };
        if (navigator.clipboard) navigator.clipboard.writeText(o.promo).then(done, done);
        else done();
      });
      wrap.appendChild(btn);
      c.appendChild(wrap);
    }

    var foot = el('div', 'bb-card__foot');
    if (o.book && (o.book.from || o.book.to)) {
      var a = el('a', 'bb-btn bb-btn--main', 'Выбрать даты и забронировать');
      a.href = BB.bookUrl({
        from: o.book.from, to: o.book.to,
        adults: o.book.adults, children: o.book.children,
        promo: o.promo, rooms: o.book.rooms
      });
      a.setAttribute('data-bb-book', '');
      a.setAttribute('data-from', o.book.from || '');
      a.setAttribute('data-to', o.book.to || '');
      if (o.book.adults) a.setAttribute('data-adults', o.book.adults);
      if (o.book.children) a.setAttribute('data-children', o.book.children);
      if (o.promo) a.setAttribute('data-promo', o.promo);
      if (o.book.rooms) a.setAttribute('data-rooms', o.book.rooms);
      a.setAttribute('data-offer', o.id);
      foot.appendChild(a);
    }
    if (o.more) {
      var m = el('a', 'bb-btn bb-btn--ghost', 'Подробные условия');
      m.href = o.more;
      m.addEventListener('click', function () { BB.goal && BB.goal('offer_more_click', { offer: o.id }); });
      foot.appendChild(m);
    }
    c.appendChild(foot);
    return c;
  }

  /* --- Фильтры ------------------------------------------------------------ */
  var used = {};
  live.forEach(function (o) { (o.tags || []).forEach(function (t) { if (TAGS[t]) used[t] = 1; }); });

  var active = 'all';
  function chip(key, label) {
    var b = el('button', 'bb-chip', label);
    b.type = 'button';
    b.setAttribute('aria-pressed', key === active ? 'true' : 'false');
    b.addEventListener('click', function () {
      active = key;
      box.querySelectorAll('.bb-chip').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      apply();
      BB.goal && BB.goal('offer_filter', { filter: key });
    });
    return b;
  }
  box.appendChild(chip('all', 'Все предложения'));
  Object.keys(TAGS).forEach(function (k) { if (used[k]) box.appendChild(chip(k, TAGS[k])); });

  function apply() {
    var shown = 0;
    grid.querySelectorAll('.bb-card').forEach(function (c) {
      var ok = active === 'all' || (' ' + c.getAttribute('data-tags') + ' ').indexOf(' ' + active + ' ') > -1;
      c.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown > 0;
    /* Разные пустые состояния: «фильтр не совпал» и «все акции истекли».
       Второе — сигнал контент-менеджеру, что каталог пора обновить. */
    if (!live.length) {
      empty.innerHTML = 'Сейчас действующих предложений нет. ' +
        'Позвоните в отдел бронирования — подберём вариант под ваши даты.';
    }
  }
  empty.querySelector('[data-bb-reset]').addEventListener('click', function (e) {
    e.preventDefault();
    box.querySelector('.bb-chip').click();
  });

  /* --- Отрисовка ---------------------------------------------------------- */
  live.forEach(function (o) { grid.appendChild(card(o)); });
  apply();

  /* --- Таймеры ------------------------------------------------------------ */
  function plural(n, a, b, c) {
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return a;
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return b;
    return c;
  }
  function tick() {
    var nowMsk = BB.now().getTime();
    grid.querySelectorAll('[data-until]').forEach(function (t) {
      var u = t.getAttribute('data-until');
      var end = new Date(u + 'T23:59:59').getTime();
      var left = end - nowMsk;
      if (left <= 0) { t.textContent = 'Предложение завершено'; return; }
      var d = Math.floor(left / 864e5), h = Math.floor(left % 864e5 / 36e5), m = Math.floor(left % 36e5 / 6e4);
      t.classList.toggle('bb-card__timer--soon', d < 3);
      t.textContent = d > 0
        ? 'До конца предложения ' + d + ' ' + plural(d, 'день', 'дня', 'дней') + ' ' + h + ' ч'
        : 'Осталось ' + h + ' ч ' + m + ' мин';
    });
  }
  tick();
  setInterval(tick, 60000);
})();
</script>
