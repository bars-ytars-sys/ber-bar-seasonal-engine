<script>
(function () {
  /* Названия разделов для крошек. Ключ — кусок адреса страницы.
     Чего нет в списке — берём заголовок страницы, он всегда осмысленный. */
  var РАЗДЕЛЫ = {
    'doma':          'Дома',
    'spa':           'SPA-комплекс',
    'banchan':       'Бани и банные чаны',
    'booking':       'Бронирование',
    'special':       'Специальные предложения',
    'vip-programmy': 'VIP-программы',
    'svidanie':      'Свидание года',
    'perezagruzka':  'Перезагрузка',
    'deti':          'Детям',
    'about':         'О базе отдыха',
    'contacts':      'Контакты',
    'kartabr':       'Карта базы отдыха',
    'tarif':         'Тарифы',
    'aktivnosti-v-beryozovoj-roshhe': 'Активности'
  };

  function добавить(данные) {
    var s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(данные);
    document.head.appendChild(s);
  }

  /* ── хлебные крошки ── */
  function крошки() {
    var части = location.pathname.split('/').filter(Boolean);
    if (!части.length) return;               /* на главной крошки не нужны */

    var список = [{
      '@type': 'ListItem', position: 1,
      name: 'Берёзовая роща', item: 'https://ecobr.ru/'
    }];
    var путь = '';
    for (var i = 0; i < части.length; i++) {
      путь += '/' + части[i];
      var последний = i === части.length - 1;
      var имя = РАЗДЕЛЫ[части[i]];
      if (!имя && последний) {
        /* Заголовок страницы без хвоста с названием базы. Эмодзи в начале
           убираем: в крошках выдачи домик смотрится мусором. */
        имя = (document.title || '').split(/[|–—]/)[0]
                .replace(/^[^\p{L}\p{N}]+/u, '').trim();
      }
      if (!имя) имя = части[i];
      var пункт = { '@type': 'ListItem', position: i + 2, name: имя };
      if (!последний) пункт.item = 'https://ecobr.ru' + путь;
      список.push(пункт);
    }
    добавить({ '@context': 'https://schema.org', '@type': 'BreadcrumbList', itemListElement: список });
  }

  /* ── вопросы и ответы ── */
  var вопросыДобавлены = false;
  function вопросы() {
    if (вопросыДобавлены) return;
    /* Аккордеоны Тильды: T585, T668 и родня. Берём пары «заголовок — текст». */
    var пары = [];
    var узлы = document.querySelectorAll(
      '.t585__title, .t668__title, .t525__title, [class*="__accordion"] [class*="title"]');
    for (var i = 0; i < узлы.length; i++) {
      var з = узлы[i];
      var тело = з.parentNode &&
        з.parentNode.querySelector('[class*="text"], [class*="descr"], [class*="content"]');
      var в = (з.textContent || '').replace(/\s+/g, ' ').trim();
      var о = тело ? (тело.textContent || '').replace(/\s+/g, ' ').trim() : '';
      if (в.length > 5 && о.length > 15) пары.push({ в: в, о: о });
    }
    if (пары.length < 2) return;             /* одна пара — не FAQ, не размечаем */

    вопросыДобавлены = true;
    добавить({
      '@context': 'https://schema.org',
      '@type': 'FAQPage',
      mainEntity: пары.map(function (p) {
        return {
          '@type': 'Question', name: p.в,
          acceptedAnswer: { '@type': 'Answer', text: p.о }
        };
      })
    });
  }

  function пуск() { крошки(); вопросы(); }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', пуск);
  else пуск();
  /* Блоки Тильды доезжают позже — досматриваем вопросы ещё раз. */
  setTimeout(вопросы, 4000);
})();
</script>

<script>
(function () {
  /* что на что меняем: точный адрес → правильный */
  var ЗАМЕНЫ = {
    '/policy': '/privacy',      /* политика конфиденциальности */
    '/zayavka': '#zayavka',     /* кнопка «Заказать звонок» — якорь, не страница */
    'https://ecobr.ru/baus-1': '/doma/baus-1',  /* подсказка на карте */
    '/chanyibani': '/banchan'   /* БП, /barski: «Читать подробнее» под сауной */
  };

  var починено = 0;

  function пройтись() {
    for (var битый in ЗАМЕНЫ) {
      var ссылки = document.querySelectorAll('a[href="' + битый + '"]');
      for (var i = 0; i < ссылки.length; i++) {
        var а = ссылки[i];
        if (а.getAttribute('data-link-fixed')) continue;
        var цель = ЗАМЕНЫ[битый];
        /* Для якоря убеждаемся, что ему есть куда вести. У Тильды это
           бывает двух видов: обычный элемент с таким id либо линкхук
           всплывающего окна — тогда на странице уже есть другие ссылки
           с этим же якорем. Не нашли ни того ни другого — не трогаем,
           иначе кнопка перестанет работать совсем. */
        if (цель.charAt(0) === '#') {
          var имя = цель.slice(1);
          var естьЦель = document.getElementById(имя) ||
                         document.querySelector('a[href="#' + имя + '"]');
          if (!естьЦель) continue;
        }
        а.setAttribute('data-link-fixed', '1');
        а.setAttribute('href', цель);
        починено++;
      }
    }
  }

  пройтись();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', пройтись);
  /* Формы и зеро-блоки Тильды доезжают позже — досматриваем страницу. */
  var т = setInterval(пройтись, 700);
  setTimeout(function () { clearInterval(т); пройтись(); }, 20000);
})();
</script>

     Как. Фото в этих блоках вставлены фоном прямо в style — Тильда их

     подходит к блоку ближе чем на 800 px, блок получает класс
     eco-foto-pora и фото грузятся. Скрытые на телефоне блоки так и не
     качаются. На компьютере всё то же самое — просто по мере прокрутки.

     Страховка: через 8 секунд после полной загрузки страницы фото
     показываются везде, даже если что-то пойдёт не так.
     ================================================================== -->
<style>
#rec2851363001:not(.eco-foto-pora) [style*="static.tildacdn.com"],
#rec2421263681:not(.eco-foto-pora) [style*="static.tildacdn.com"],
#rec2421311281:not(.eco-foto-pora) [style*="static.tildacdn.com"],
#rec2421311371:not(.eco-foto-pora) [style*="static.tildacdn.com"] {
  background-image: none !important;
}
</style>
<script>
(function () {
  var БЛОКИ = ['rec2851363001', 'rec2421263681', 'rec2421311281', 'rec2421311371'];

  function показать(блок) { блок.classList.add('eco-foto-pora'); }
  function показатьВсе() {
    БЛОКИ.forEach(function (id) { var б = document.getElementById(id); if (б) показать(б); });
  }

  function начать() {
    var список = БЛОКИ.map(function (id) { return document.getElementById(id); })
                      .filter(Boolean);
    if (!('IntersectionObserver' in window)) { показатьВсе(); return; }
    var наблюдатель = new IntersectionObserver(function (записи) {
      записи.forEach(function (з) {
        if (з.isIntersecting) { показать(з.target); наблюдатель.unobserve(з.target); }
      });
    }, { rootMargin: '800px 0px' });
    список.forEach(function (б) { наблюдатель.observe(б); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', начать);
  else начать();
  window.addEventListener('load', function () { setTimeout(показатьВсе, 8000); });
})();
</script>

     пришёл один файл: `tilda-blocks-page<pageid>.min.css` из раздачи
     `static.tildacdn.com/ws/project4027012/`. В нём размеры и положение
     всех элементов зеро-блоков; картинки и скрипты при этом приходят
     обычным порядком, поэтому страница не пустая, а разобранная.

     У Берёзовой рощи устройство то же. Проверено 12.09.2026 на живой
     главной ecobr.ru блокировкой этого запроса:
       файл пришёл    — горизонтальной прокрутки нет, высота 11 138;
       файл не пришёл — прокрутка есть, высота 16 283, картинки
                        расползаются своим натуральным размером.

     ПОЧЕМУ НУЖНА СВОЯ. У Тильды страховка есть: у каждого <link> стоит
     onerror, а neo.tildacdn.com отдаёт скрипт, который перезагружает файл
     с запасного адреса. Работает она только при явной ошибке запроса и
     только если доступен сам neo — он грузит сторожа, тот отдельным
     запросом тянет второй скрипт. Обрыв без ошибки, зависший запрос,
     недоступный neo — и страница остаётся разобранной до перезагрузки
     руками.

     ЧТО ДЕЛАЕМ. Через 0,8, 2, 4, 8, 15 и 25 секунд, а также после события
     load смотрим каждый <link> со стилями Тильды: применился ли он
     (свойство link.sheet). Если нет — подставляем тот же файл с запасного
     адреса: static.tildacdn.info, затем .pub, затем .one. Между попытками
     три секунды: пока копия грузится, link.sheet у неё тоже пустой, и без
     паузы осмотр заказал бы все три зеркала сразу. Как только копия
     применилась, попытки прекращаются.

     На исправной странице код себя не проявляет: лишних запросов ноль.
     Тот же кусок стоит в HEAD Барских полей — там он проверен на живой
     странице: без него аватарка отзыва 584 точки и прокрутка, с ним —
     29 точек и нормальная страница на второй секунде.
     ================================================================== -->
<script>
(function () {
  /* Запасные адреса той же раздачи Тильды, по порядку попыток. */
  var ЗЕРКАЛА = ['static.tildacdn.info', 'static.tildacdn.pub', 'static.tildacdn.one'];
  /* Когда осматривать страницу, миллисекунды от начала загрузки. */
  var ПРОВЕРКИ = [800, 2000, 4000, 8000, 15000, 25000];
  /* Сколько ждать подставленную копию, прежде чем брать следующее зеркало:
     пока она грузится, link.sheet ещё пустой, и без этой паузы осмотр
     заказал бы все три зеркала подряд. */
  var ПАУЗА = 3000;

  /* Стили Тильды, кроме наших же подстановок. */
  function наши() {
    var все = document.querySelectorAll('link[rel="stylesheet"][href*="tildacdn."]');
    var свои = [];
    for (var i = 0; i < все.length; i++) if (!все[i].ббКопия) свои.push(все[i]);
    return свои;
  }

  /* Применился ли файл. У неудавшегося link.sheet пустой; loaderr='y'
     ставит сама Тильда в своём onerror. Чужой домен может закрыть доступ
     к правилам — это не поломка, поэтому считаем целым. */
  function цел(л) {
    if (л.loaderr === 'y') return false;
    try { return !!л.sheet; } catch (e) { return true; }
  }

  /* Уже подставленная копия работает — больше не трогаем. */
  function заменаЖива(л) {
    var з = л.ббЗамены || [];
    for (var i = 0; i < з.length; i++) {
      try { if (з[i].sheet) return true; } catch (e) { return true; }
    }
    return false;
  }

  function подменить(л) {
    var н = л.ббПопытка || 0;
    if (н >= ЗЕРКАЛА.length) return;
    л.ббПопытка = н + 1;
    л.ббКогда = Date.now();
    var к = document.createElement('link');
    к.rel = 'stylesheet';
    к.type = 'text/css';
    к.media = 'all';
    к.ббКопия = 1;
    к.onerror = function () { подменить(л); };   /* и это зеркало молчит — берём следующее */
    к.href = л.href.replace(/^https?:\/\/[^\/]+/, 'https://' + ЗЕРКАЛА[н]);
    л.ббЗамены = л.ббЗамены || [];
    л.ббЗамены.push(к);
    (document.head || document.documentElement).appendChild(к);
  }

  function осмотр() {
    var л = наши();
    for (var i = 0; i < л.length; i++) {
      if (цел(л[i]) || заменаЖива(л[i])) continue;
      if (Date.now() - (л[i].ббКогда || 0) < ПАУЗА) continue;   /* копия ещё в пути */
      подменить(л[i]);
    }
  }

  for (var i = 0; i < ПРОВЕРКИ.length; i++) setTimeout(осмотр, ПРОВЕРКИ[i]);
  window.addEventListener('load', function () { setTimeout(осмотр, 300); });
})();
</script>
