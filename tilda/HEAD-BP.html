<script>
(function () {
  /* Подсказки зеро-блока: адрес лежит в data-tipimg-original, скрипт
     Тильды позже переносит его в src. Успеваем переписать раньше.
     Работаем по любому такому адресу, а не по списку: добавят подсказку —
     она тоже будет уменьшенной. */
  var ШИРИНА = 400;

  var НАЧАЛО = 'https://static.tildacdn.com/';

  function уменьшить(адрес) {
    if (!адрес || адрес.indexOf(НАЧАЛО) !== 0) return null;
    var хвост = адрес.slice(НАЧАЛО.length);
    var черта = хвост.indexOf('/');
    if (черта < 1) return null;
    var файл = хвост.slice(0, черта), имя = хвост.slice(черта + 1);
    if (файл.indexOf('tild') !== 0 || !имя) return null;
    if (имя.slice(-4).toLowerCase() === '.svg') return null;
    return 'https://optim.tildacdn.com/' + файл + '/-/resize/' + ШИРИНА + 'x/-/format/webp/' + имя;
  }

  function пройтись() {
    var список = document.querySelectorAll('[data-tipimg-original]');
    for (var i = 0; i < список.length; i++) {
      var э = список[i];
      if (э.dataset.умен) continue;
      var новый = уменьшить(э.getAttribute('data-tipimg-original'));
      if (!новый) { э.dataset.умен = '1'; continue; }
      э.dataset.умен = '1';
      э.setAttribute('data-tipimg-original', новый);
      /* если Тильда уже успела проставить src — поправим и его */
      if (э.getAttribute('src')) э.setAttribute('src', новый);
    }
  }

  пройтись();
  /* Подсказки в зеро-блоках появляются по мере разбора страницы. */
  var т = setInterval(пройтись, 300);
  setTimeout(function () { clearInterval(т); пройтись(); }, 20000);
  document.addEventListener('DOMContentLoaded', пройтись);
})();
</script>

  };

    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(данные);
    document.head.appendChild(s);

  function крошки() {
    var части = location.pathname.split('/').filter(Boolean);
    if (!части.length) return;               /* на главной крошки не нужны */

    var список = [{
      '@type': 'ListItem', position: 1,
      name: 'Барские поля', item: 'https://barskie-polya.ru/'
    }];
    var путь = '';
    for (var i = 0; i < части.length; i++) {

      var имя = РАЗДЕЛЫ[части[i]];

        /* Заголовок страницы без хвоста с названием базы. Эмодзи в начале
           убираем: в крошках выдачи домик смотрится мусором. */
        имя = (document.title || '').split(/[|–—]/)[0]
                .replace(/^[^\p{L}\p{N}]+/u, '').trim();
      }
      if (!имя) имя = части[i];
      var пункт = { '@type': 'ListItem', position: i + 2, name: имя };
      if (!последний) пункт.item = 'https://barskie-polya.ru' + путь;
      список.push(пункт);
    }

  }

  /* ── вопросы и ответы ── */
  var вопросыДобавлены = false;
  function вопросы() {
    if (вопросыДобавлены) return;
    /* Аккордеоны Тильды: T585, T668 и родня. Берём пары «заголовок — текст». */
    var пары = [];
    var узлы = document.querySelectorAll(
      '.t585__title, .t668__title, .t525__title, [class*="__accordion"] [class*="title"]');
    for (var i = 0; i < узлы.length; i++) {
      var з = узлы[i];
      var тело = з.parentNode &&
        з.parentNode.querySelector('[class*="text"], [class*="descr"], [class*="content"]');
      var в = (з.textContent || '').replace(/\s+/g, ' ').trim();
      var о = тело ? (тело.textContent || '').replace(/\s+/g, ' ').trim() : '';
      if (в.length > 5 && о.length > 15) пары.push({ в: в, о: о });
    }
    if (пары.length < 2) return;             /* одна пара — не FAQ, не размечаем */

        };
      })
    });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', пуск);
  else пуск();
  /* Блоки Тильды доезжают позже — досматриваем вопросы ещё раз. */
  setTimeout(вопросы, 4000);
})();
</script>

(function () {

  var ЗЕРКАЛА = ['static.tildacdn.info', 'static.tildacdn.pub', 'static.tildacdn.one'];
  /* Когда осматривать страницу, миллисекунды от начала загрузки. */
  var ПРОВЕРКИ = [800, 2000, 4000, 8000, 15000, 25000];
  /* Сколько ждать подставленную копию, прежде чем брать следующее зеркало:
     пока она грузится, link.sheet ещё пустой, и без этой паузы осмотр
     заказал бы все три зеркала подряд. */
  var ПАУЗА = 3000;

  /* Стили Тильды, кроме наших же подстановок. */
  function наши() {
    var все = document.querySelectorAll('link[rel="stylesheet"][href*="tildacdn."]');
    var свои = [];
    for (var i = 0; i < все.length; i++) if (!все[i].ббКопия) свои.push(все[i]);
    return свои;
  }

  /* Применился ли файл. У неудавшегося link.sheet пустой; loaderr='y'
     ставит сама Тильда в своём onerror. Чужой домен может закрыть
     доступ к правилам — это не поломка, поэтому считаем целым. */
  function цел(л) {
    if (л.loaderr === 'y') return false;
    try { return !!л.sheet; } catch (e) { return true; }
  }

  /* Уже подставленная копия работает — больше не трогаем. */
  function заменаЖива(л) {
    var з = л.ббЗамены || [];
    for (var i = 0; i < з.length; i++) {
      try { if (з[i].sheet) return true; } catch (e) { return true; }
    }
    return false;
  }

  function подменить(л) {
    var н = л.ббПопытка || 0;
    if (н >= ЗЕРКАЛА.length) return;
    л.ббПопытка = н + 1;
    л.ббКогда = Date.now();
    var к = document.createElement('link');
    к.rel = 'stylesheet';
    к.type = 'text/css';
    к.media = 'all';
    к.ббКопия = 1;
    к.onerror = function () { подменить(л); };   /* и это зеркало молчит — берём следующее */
    к.href = л.href.replace(/^https?:\/\/[^\/]+/, 'https://' + ЗЕРКАЛА[н]);
    л.ббЗамены = л.ббЗамены || [];
    л.ббЗамены.push(к);
    (document.head || document.documentElement).appendChild(к);
  }

  function осмотр() {
    var л = наши();
    for (var i = 0; i < л.length; i++) {
      if (цел(л[i]) || заменаЖива(л[i])) continue;
      if (Date.now() - (л[i].ббКогда || 0) < ПАУЗА) continue;   /* копия ещё в пути */
      подменить(л[i]);
    }
  }

  for (var i = 0; i < ПРОВЕРКИ.length; i++) setTimeout(осмотр, ПРОВЕРКИ[i]);
  window.addEventListener('load', function () { setTimeout(осмотр, 300); });
})();
</script>
