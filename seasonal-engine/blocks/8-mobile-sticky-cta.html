<!-- =============================================================================
     БЛОК 8 · МОБИЛЬНАЯ НИЖНЯЯ ПАНЕЛЬ (для ecobr.ru)
     Куда: ecobr.ru → Настройки сайта → Ещё → HTML-код внутрь HEAD, последним.

     Зачем: у «Барских полей» нижняя закреплённая панель уже есть — это блок
     #rec2461410871 (position:fixed; bottom:0). У «Берёзовой рощи» её нет:
     на живой странице два закреплённых блока и оба сверху (#rec1729326481,
     #rec1730117851). На телефоне гость, пролиставший до середины, остаётся
     без кнопки брони вообще.

     Панель появляется только на мобильных, только после 25% прокрутки
     (чтобы не закрывать первый экран) и не показывается на /booking.

     ЧТО МЕНЯЕТ КОНТЕНТ-МЕНЕДЖЕР: текст и телефон в блоке CFG.
     ============================================================================= -->
<script>
(function () {
  'use strict';
  var BB = window.BB || {};
  if (!BB.num || BB.site !== 'eco') return;             /* у БП своя панель */
  if (location.pathname.indexOf('/booking') === 0) return;

  var CFG = {
    phone:    '+74951202008',
    phoneText:'Позвонить',
    cta:      'Проверить даты',
    href:     '/booking?scroll_to_rooms=1',
    hint:     'от 11 900 ₽ / сутки'                     /* пусто — не показывать */
  };

  var css =
    '.bb-sticky{position:fixed;left:0;right:0;bottom:0;z-index:9980;display:none;align-items:center;gap:10px;' +
      'padding:10px 12px;box-sizing:border-box;background:var(--bb-surface);' +
      'border-top:1px solid var(--bb-line);box-shadow:0 -4px 16px rgba(0,0,0,.08);' +
      'padding-bottom:calc(10px + env(safe-area-inset-bottom))}' +
    '.bb-sticky.is-on{display:flex}' +
    '.bb-sticky__l{flex:1;min-width:0;font:12px/1.25 var(--bb-font);color:var(--bb-muted)}' +
    '.bb-sticky__l b{display:block;font:600 14px/1.2 var(--bb-font);color:var(--bb-ink)}' +
    '.bb-sticky__tel{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--bb-line);' +
      'display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--bb-ink)}' +
    '.bb-sticky__go{flex:none;background:var(--bb-accent);color:var(--bb-accent-ink);text-decoration:none;' +
      'border-radius:12px;padding:14px 20px;font:600 15px/1 var(--bb-font)}' +
    '@media(min-width:640px){.bb-sticky{display:none !important}}' +
    '@media(max-width:639px){body{padding-bottom:72px}}';

  var st = document.createElement('style');
  st.appendChild(document.createTextNode(css));
  (document.head || document.documentElement).appendChild(st);

  function mount() {
    var bar = document.createElement('div');
    bar.className = 'bb-sticky';

    var l = document.createElement('div');
    l.className = 'bb-sticky__l';
    l.innerHTML = '<b>Экобаза «Берёзовая роща»</b>' + (CFG.hint ? CFG.hint : '');

    var tel = document.createElement('a');
    tel.className = 'bb-sticky__tel';
    tel.href = 'tel:' + CFG.phone;
    tel.setAttribute('aria-label', CFG.phoneText);
    tel.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 ' +
      '2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 ' +
      '2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.8 2Z"/></svg>';

    var go = document.createElement('a');
    go.className = 'bb-sticky__go';
    go.href = CFG.href;
    go.textContent = CFG.cta;
    go.setAttribute('data-offer', 'sticky-mobile');

    bar.appendChild(l); bar.appendChild(tel); bar.appendChild(go);
    document.body.appendChild(bar);

    var shown = false;
    function onScroll() {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      var on = h > 0 && (window.pageYOffset / h) > 0.25;
      bar.classList.toggle('is-on', on);
      if (on && !shown) { shown = true; BB.goal && BB.goal('sticky_show'); }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();
</script>
