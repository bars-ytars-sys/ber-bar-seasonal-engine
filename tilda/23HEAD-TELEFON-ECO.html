<!-- ====================================================================
     ТЕЛЕФОН В МЕНЮ — только Берёзовая роща

     Найдено 11.09.2026. В мобильном меню (зеро-блок rec1729227991 из
     шапки) у номера «+7 (495) 120-20-08» ссылка tel:+74951503908 — это
     номер Барских полей: гость из меню звонит на другую базу.
     У кнопки связи (rec1841867761) ссылка tel:74951202008 без плюса —
     с мобильного такой номер может не набраться.

     Меняем только эти две ссылки. Номер Барских полей, подписанный
     как номер Барских полей, не трогаем — условие по тексту ссылки.

     ЭТО ЗАПЛАТКА. Правильно — поправить ссылки в зеро-блоке меню
     (страница Header, 106226836) и в кнопке связи; тогда код можно убрать.
     ================================================================== -->
<script>
(function () {
  var ВЕРНЫЙ = 'tel:+74951202008';

  function пройтись() {
    var ссылки = document.querySelectorAll('a[href^="tel:"]:not([data-tel-fixed])');
    for (var i = 0; i < ссылки.length; i++) {
      var а = ссылки[i];
      var адрес = а.getAttribute('href');
      var текст = а.textContent || '';
      var чинить = (адрес === 'tel:+74951503908' && текст.indexOf('120-20-08') !== -1) ||
                   адрес === 'tel:74951202008';
      if (!чинить) continue;
      а.setAttribute('data-tel-fixed', '1');
      а.setAttribute('href', ВЕРНЫЙ);
    }
  }

  пройтись();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', пройтись);
  /* меню и кнопка связи доезжают позже — досматриваем */
  var т = setInterval(пройтись, 700);
  setTimeout(function () { clearInterval(т); пройтись(); }, 20000);
})();
</script>
