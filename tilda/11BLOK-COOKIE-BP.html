<!-- НИЖНЕЕ МЕНЮ НЕ ЗАКРЫВАЕТ СОГЛАСИЕ НА COOKIE — блок для barskie-polya.ru
     Тильда → Библиотека → Другое → T123 (HTML-код) → вставить целиком.

     КУДА СТАВИТЬ: на страницу бронирования /booking, любым блоком
     (лучше последним). Блок ничего не рисует, он только следит за
     положением нижнего меню.

     ЧТО ЛЕЧИМ. На телефоне модуль бронирования показывает свою плашку
     «Используя модуль онлайн-бронирования, вы даёте согласие…».
     Кнопка «Принять и закрыть» приходится на 780–824 пиксель страницы,
     а закреплённое нижнее меню занимает 778–844: при открытии страницы
     кнопка оказывается ровно под меню. Гость жмёт в неё и попадает
     в «Написать нам», плашка не закрывается и мешает дальше.
     Плашка живёт внутри окна модуля на чужом домене — подвинуть её
     стилями нельзя, поэтому уступает меню.

     КАК ЛЕЧИМ. Пока страница не прокручена (первый экран, где и стоит
     плашка), нижнее меню уезжает вниз. Стоит прокрутить страницу —
     меню возвращается на место. На компьютере ничего не меняется.

     Уберёте блок — всё вернётся как было.
     -->
<style>
/* Меню не прячем совсем, а сдвигаем за край: так оно возвращается
   плавно и не дёргает раскладку страницы. */
@media (max-width: 640px) {
  #rec2238427471 .t975,
  #rec2238427471 .t975__wrapper {
    transition: transform .25s ease;
  }
  #rec2238427471.bpm-away .t975,
  #rec2238427471.bpm-away .t975__wrapper {
    transform: translateY(115%);
  }
}
</style>

<script>
(function () {
  var МЕНЮ = 'rec2238427471';       /* блок нижнего меню */
  var ПОРОГ = 130;                  /* насколько прокрутить, чтобы меню вернулось */

  /* Только страница бронирования: на остальных меню ничего не закрывает. */
  if (location.pathname.indexOf('booking') === -1) return;

  function телефон() { return window.matchMedia('(max-width: 640px)').matches; }

  var меню = null;
  function найти() {
    if (!меню) меню = document.getElementById(МЕНЮ);
    return меню;
  }

  function пересчитать() {
    var м = найти();
    if (!м) return;
    var сверху = (window.pageYOffset || document.documentElement.scrollTop) < ПОРОГ;
    if (телефон() && сверху) м.classList.add('bpm-away');
    else м.classList.remove('bpm-away');
  }

  /* Блок меню появляется не сразу — ждём его несколько секунд. */
  var т = setInterval(function () { if (найти()) { clearInterval(т); пересчитать(); } }, 200);
  setTimeout(function () { clearInterval(т); }, 15000);

  пересчитать();
  window.addEventListener('scroll', пересчитать, { passive: true });
  window.addEventListener('resize', пересчитать);
})();
</script>
