<!-- БР: Настройки сайта → Ещё → HTML-код внутри HEAD. Картинки и точки карты сохраняются. -->
<style id="br-map-labels">.tn-atom__tip-text,.tn-atom__tip-text a,.tn-atom__tip-text u{color:#222831!important;text-decoration:none!important;border:0!important;box-shadow:none!important}</style>
<script id="br-map-names">(function(){function fix(){document.querySelectorAll('.tn-atom__tip-text').forEach(function(el){var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),n;while(n=w.nextNode())n.nodeValue=n.nodeValue.replace(/BAUS[ -]?(\d)/gi,'Баус-$1');});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fix);else fix();document.addEventListener('pointerover',function(e){if(e.target.closest('.tn-atom__tip,.tn-atom__tip-text'))fix();});})();</script>
