<!-- ФОТОГРАФИИ И ЛИСТАЛКА — блок для ecobr.ru
     Тильда → Библиотека → Другое → T123 (HTML-код) → вставить целиком.
     Поставить последним блоком на главной. Блок ничего не рисует сам.
     Внутри две независимые починки: фотографии в каруселях и подпись
     к подсказке «листайте». Каждая описана перед своим кодом.
     -->

<!-- ЧАСТЬ ПЕРВАЯ: ФОТОГРАФИИ ЗАСТРЯЛИ ЗАГЛУШКАМИ

     ЧТО ЛЕЧИМ. Часть фотографий на главной показывается размытыми
     прямоугольниками. Это не качество съёмки: Тильда сначала ставит
     крошечную заглушку шириной 20 точек, а настоящий файл подставляет
     скриптом, когда картинка подходит к экрану. Настоящий адрес лежит
     рядом, в атрибуте data-original, — но для карточек внутри
     горизонтальных каруселей подмена не срабатывает, и заглушка
     остаётся навсегда. Гость видит её растянутой на 341×192 точки.

     Замер 08.09.2026: на главной так застряли 12 фотографий —
     в блоках «SPA-комплекс» (rec1910740261 и rec2263527021) и
     «Свидание года» (rec1758781921). Родная функция Тильды
     t_lazyload_update() их не поднимает, а ручная подстановка адреса
     поднимает все.

     ЧТО ДЕЛАЕМ. Проходим по карточкам, у которых остался адрес
     заглушки, и подставляем настоящий из data-original. Делаем это
     не сразу для всей страницы, а когда карточка подходит к экрану:
     на главной и без того 105 картинок разом, добавлять к ним ещё
     десяток на старте незачем.

     Блок безопасно оставить насовсем: он трогает только те картинки,
     у которых адрес всё ещё заглушечный. Починит Тильда сама —
     подставлять будет нечего, и блок промолчит.
     -->
<script>
(function () {
  /* Заглушка узнаётся по адресу: thb.tildacdn.com/…/-/resizeb/20x/… */
  function заглушка(адрес) {
    return /\/-\/resizeb?\/\d{1,3}x\//.test(адрес || '');
  }

  function текущийФон(э) {
    var ф = getComputedStyle(э).backgroundImage || '';
    var м = ф.match(/url\(["']?([^"')]+)/);
    return м ? м[1] : '';
  }

  function поднять(э) {
    if (э.dataset.фотоПоднято) return;
    var настоящий = э.getAttribute('data-original');
    if (!настоящий || заглушка(настоящий)) return;
    if (!заглушка(текущийФон(э))) { э.dataset.фотоПоднято = '1'; return; }
    э.dataset.фотоПоднято = '1';
    э.style.backgroundImage = "url('" + настоящий + "')";
  }

  /* Следим за блоком целиком, а не за отдельной карточкой. Карточки
     каруселей стоят за правым краем экрана, в поле зрения не попадают
     никогда — ровно поэтому их не поднимает и родной скрипт Тильды.
     Как только блок подошёл к экрану, поднимаем всё, что внутри. */
  function поднятьБлок(рек) {
    var сп = рек.querySelectorAll('[data-original]');
    for (var i = 0; i < сп.length; i++) if (сп[i].tagName !== 'IMG') поднять(сп[i]);
  }

  var наблюдатель = ('IntersectionObserver' in window)
    ? new IntersectionObserver(function (записи) {
        записи.forEach(function (з) {
          if (!з.isIntersecting) return;
          поднятьБлок(з.target);
          наблюдатель.unobserve(з.target);
        });
      }, { rootMargin: '600px 0px' })   /* с запасом, чтобы гость не застал подмену */
    : null;

  function пройтись() {
    var блоки = {};
    var список = document.querySelectorAll('[data-original]');
    for (var i = 0; i < список.length; i++) {
      var э = список[i];
      if (э.tagName === 'IMG') continue;      /* обычные <img> Тильда поднимает исправно */
      var рек = э.closest ? э.closest('.t-rec') : null;
      if (!рек || рек.dataset.фотоВзято) continue;
      блоки[рек.id] = рек;
    }
    for (var id in блоки) {
      var рек = блоки[id];
      рек.dataset.фотоВзято = '1';
      if (наблюдатель) наблюдатель.observe(рек); else поднятьБлок(рек);
    }
  }

  /* Карусели собираются не сразу, поэтому досматриваем страницу
     первые полминуты. */
  пройтись();
  var т = setInterval(пройтись, 700);
  setTimeout(function () { clearInterval(т); пройтись(); }, 30000);
  document.addEventListener('DOMContentLoaded', пройтись);
})();
</script>

<!-- ЧАСТЬ ВТОРАЯ: ПОДПИСЬ К ЛИСТАЛКЕ

     ЧТО ЛЕЧИМ. Над каруселями Тильда показывает свою подсказку: три
     серые карточки и рука, которая по ним скользит вбок. На телефоне
     она размером 42 точки, и в большинстве кадров анимации видно
     только один серый квадрат с пальцем вверх. Стоит он в просвете
     сразу под белой карточкой предыдущего блока — и читается как
     «пролистай вот это, что выше», хотя относится к карусели снизу.

     Перевернуть палец вниз нельзя: жест боковой, а «вниз» прочтётся
     как «прокрути страницу». Поэтому добавляем словами — подпись
     «листайте вбок» рядом с иконкой. Дальше догадываться не нужно.

     ГДЕ ЭТО НА ГЛАВНОЙ: три карусели —
       rec1910740261 «SPA-комплекс, бани и чаны»,
       rec2432132061 «Дома и цены»,
       rec2258813491 лента новостей.
     Правило написано по классам Тильды, а не по номерам блоков:
     появится ещё одна карусель — подпись будет и у неё.
     -->
<style>
/* Обёртку делаем строкой: подпись и иконка рядом, а не одна под другой.
   У Тильды она блочная, и подпись сама по себе переносится. */
.t1196__scroll-icon-wrapper,
.t1281__scroll-icon-wrapper,
.t1004__scroll-icon-wrapper {
  display: flex !important;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: nowrap;
}

/* В блоке «Дома и цены» иконка прижата к левому краю — подпись туда же. */
.t1281__scroll-icon-wrapper { justify-content: flex-start; }

/* Шрифт и цвет сняты с текста сайта: TildaSans и серый примечаний,
   тот же, каким набрано «Акции не суммируются». Через inherit нельзя —
   у body на ecobr.ru стоит Times New Roman, подпись вышла бы с засечками. */
.t1196__scroll-icon-wrapper::before,
.t1281__scroll-icon-wrapper::before,
.t1004__scroll-icon-wrapper::before {
  content: 'листайте вбок';
  font-family: TildaSans, Arial, sans-serif;
  font-size: 13px;
  line-height: 1;
  letter-spacing: .02em;
  color: #6c7370;
  white-space: nowrap;
}

.t1196__scroll-icon-wrapper > svg,
.t1281__scroll-icon-wrapper > svg,
.t1004__scroll-icon-wrapper > svg { flex: none; }

/* На узких экранах подпись покороче, чтобы иконка не ушла за край. */
@media screen and (max-width: 360px) {
  .t1196__scroll-icon-wrapper::before,
  .t1281__scroll-icon-wrapper::before,
  .t1004__scroll-icon-wrapper::before {
    content: 'листайте';
    font-size: 12px;
  }
}
</style>
