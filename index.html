<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Берёзовая роща — осень 2026</title>
<style>
  :root{
    --bar:#14171a;
    --line:#2b3036;
    --dim:#8d979f;
    --eco:#2ed8a3;   /* мятный акцент Берёзовой рощи */
    --bp:#c07a41;    /* коричневый акцент Барских полей */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bar);
    font:14px/1.4 -apple-system,'Segoe UI',system-ui,Arial,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  nav{flex:none;display:flex;gap:8px;padding:8px}
  nav a{
    flex:1;text-align:center;padding:8px 14px;border-radius:5px;
    border:1px solid var(--line);color:var(--dim);
    text-decoration:none;white-space:nowrap;
  }
  nav a:hover{color:#eceff2}
  /* Активная вкладка красится акцентом своего сайта */
  nav a[aria-current="page"]{color:#0f1214;font-weight:600;border-color:transparent}
  nav a[data-site="bereza"][aria-current="page"]{background:var(--eco)}
  nav a[data-site="barskie"][aria-current="page"]{background:var(--bp);color:#fff}
  iframe{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body>

<nav>
  <a href="#bereza"  data-site="bereza">Берёзовая роща</a>
  <a href="#barskie" data-site="barskie">Барские поля</a>
</nav>

<iframe id="frame" title="Просмотр сайта"></iframe>

<script>
/* Один адрес на оба сайта. Выбор живёт в хэше, поэтому ссылкой
   вида …/#barskie можно сразу открыть нужный. */
(function () {
  var САЙТЫ = { bereza: 'bereza.html', barskie: 'barskie.html' };
  var frame = document.getElementById('frame');
  var tabs = document.querySelectorAll('nav a');

  function показать() {
    var имя = (location.hash || '#bereza').slice(1);
    if (!САЙТЫ[имя]) имя = 'bereza';

    /* Перезагружаем кадр только при смене сайта: страницы тяжёлые. */
    if (frame.dataset.site !== имя) {
      frame.dataset.site = имя;
      frame.src = САЙТЫ[имя];
    }
    tabs.forEach(function (a) {
      if (a.dataset.site === имя) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    document.title = (имя === 'bereza' ? 'Берёзовая роща' : 'Барские поля') + ' — осень 2026';
  }

  window.addEventListener('hashchange', показать);
  показать();
})();
</script>

</body>
</html>
