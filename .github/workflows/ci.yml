name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверки движка
        run: node test/engine.test.mjs
      - name: Стенд собирается и не разошёлся с исходниками
        run: |
          node demo/build.mjs
          git diff --exit-code -- stend.html playbook.html \
            || (echo "stend.html/playbook.html не пересобраны — запустите node demo/build.mjs и закоммитьте" && exit 1)
