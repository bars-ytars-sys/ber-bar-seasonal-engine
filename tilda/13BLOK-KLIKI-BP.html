<!-- НАКЛАДКА ВСПЛЫВАШКИ НЕ ЛОВИТ КЛИКИ — блок для barskie-polya.ru
     Тильда → Библиотека → Другое → T123 (HTML-код) → вставить целиком.
     Поставить любым блоком на главной. Блок ничего не рисует.

     ЧТО ЛЕЧИМ. Обёртка блока всплывающего окна rec2461410871 растянута
     на весь экран: position fixed, z-index 9999999, размер 1600×900.
     Само окно занимает только полосу внизу, но обёртка прозрачная и
     невидимая — а клики принимает на себя вся её площадь. Из-за этого
     по странице не проходит ни перетаскивание карточек, ни часть
     нажатий: палец попадает не в кнопку, а в пустую накладку.

     ЧТО ДЕЛАЕМ. Накладку делаем прозрачной для мыши, а самому окну
     клики возвращаем. Внешне не меняется ничего.
     -->
<style>
/* Пустая площадь обёртки пропускает клики насквозь… */
#rec2461410871 .t396.n020-show,
#rec2461410871 .t396.n020-hide{
  pointer-events:none;
}
/* …а само окно и всё внутри него нажимается как прежде. */
#rec2461410871 .t396__artboard,
#rec2461410871 .t396__artboard *{
  pointer-events:auto;
}
</style>
